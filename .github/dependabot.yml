version: 2
updates:
  - package-ecosystem: opentofu
    directories:
      - /tofu
      - /tofu-firewall
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: Chore
    groups:
      opentofu:
        update-types:
          - minor
          - patch
